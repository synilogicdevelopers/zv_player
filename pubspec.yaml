name: zv_player
description: >-
  A cinematic, capability-driven video player for Flutter. MP4, HLS, DASH and
  local files play natively (Media3 on Android, AVPlayer on iOS); YouTube plays
  through the official IFrame API under the same player UI.
version: 0.1.5
homepage: https://github.com/synilogicdevelopers/zv_player
repository: https://github.com/synilogicdevelopers/zv_player
issue_tracker: https://github.com/synilogicdevelopers/zv_player/issues
topics:
  - video
  - video-player
  - hls
  - dash
  - youtube

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  # The YouTube engine's web view. Current releases of the Android
  # implementation (4.12.1+) build with Android Gradle Plugin 9.
  webview_flutter: ^4.13.0
  webview_flutter_android: ^4.10.0
  webview_flutter_wkwebview: ^3.23.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.synilogic.zv_player
        pluginClass: ZvPlayerPlugin
      ios:
        pluginClass: ZvPlayerPlugin

  # The player's own typeface, so the chrome looks the same in any host.
  fonts:
    - family: Poppins
      fonts:
        - asset: fonts/Poppins-Regular.ttf
          weight: 400
        - asset: fonts/Poppins-Medium.ttf
          weight: 500
        - asset: fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: fonts/Poppins-Bold.ttf
          weight: 700
